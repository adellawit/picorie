<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Picorie Photobooth — Choose Frame</title>
<style>
  :root{ --red:#eb5c5d; --maroon:#782b37; }
  html,body{margin:0;height:100%;overflow:hidden;background:#f6f2eb}
  #viewport{position:fixed;inset:0;overflow:hidden;background:#f6f2eb}
  #stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;margin:-540px 0 0 -960px;transform-origin:center center}
  #stage img{position:absolute;display:block;max-width:none;left:0;top:0;width:1920px;height:1080px}
  .hot{position:absolute;border:0;background:transparent;padding:0;margin:0;cursor:pointer}
  .card-hot{position:absolute;border:0;background:transparent;padding:0;margin:0;cursor:pointer;border-radius:16px}
  .sel-border{position:absolute;border:4px solid var(--red);border-radius:18px;pointer-events:none;box-sizing:border-box}
  .preview-crop{position:absolute;background-repeat:no-repeat;border-radius:14px;pointer-events:none;box-shadow:0 0 0 1px rgba(0,0,0,.04)}
  .next-hot{position:absolute;border:0;background:transparent;padding:0;margin:0;cursor:pointer}
</style>
</head>
<body>
<div id="viewport">
  <main id="stage">
    <img id="bgShot" src="asset/choose-frame/screen_choose.png" alt="">
    <button class="hot" id="tab-choose-hot" style="left:211px;top:76px;width:270px;height:68px" title="Choose Frame"></button>
    <button class="hot" id="tab-create-hot" style="left:481px;top:76px;width:293px;height:68px" title="Create Template"></button>
    <div id="overlayLayer"></div>
  </main>
</div>
<script>
(function(){
  "use strict";
  var BG = {
    choose: 'asset/choose-frame/screen_choose.png',
    create: 'asset/choose-frame/screen_create.png'
  };
  var CARDS = {
    choose: {
      w:304, h:458,
      pos:[[238,242],[583,242],[928,242],[238,718],[583,718],[928,718]],
      preview:{x:1345,y:402,w:304,h:458},
      next:{x:1345,y:885,w:306,h:63}
    },
    create: {
      w:304, h:480,
      pos:[[242,225],[592,225],[940,225],[242,752],[592,752],[940,752]],
      preview:{x:1355,y:383,w:290,h:452},
      next:{x:1355,y:858,w:290,h:60}
    }
  };

  var state = { tab:'choose', selected:{choose:null, create:null} };

  function $(s){return document.querySelector(s);}

  function render(){
    $('#bgShot').src = BG[state.tab];
    var cfg = CARDS[state.tab];
    var layer = $('#overlayLayer');
    layer.innerHTML = '';

    cfg.pos.forEach(function(p, i){
      var btn = document.createElement('button');
      btn.className = 'card-hot';
      btn.style.left = p[0]+'px'; btn.style.top = p[1]+'px';
      btn.style.width = cfg.w+'px'; btn.style.height = cfg.h+'px';
      btn.title = 'Pilih frame ini';
      btn.addEventListener('click', (function(idx){
        return function(){ state.selected[state.tab] = idx; render(); };
      })(i));
      layer.appendChild(btn);
    });

    var sel = state.selected[state.tab];
    if(sel !== null){
      var p = cfg.pos[sel];
      var border = document.createElement('div');
      border.className = 'sel-border';
      border.style.left = (p[0]-4)+'px'; border.style.top=(p[1]-4)+'px';
      border.style.width=(cfg.w)+'px'; border.style.height=(cfg.h)+'px';
      layer.appendChild(border);

      var prev = document.createElement('div');
      prev.className = 'preview-crop';
      prev.style.left = cfg.preview.x+'px'; prev.style.top = cfg.preview.y+'px';
      prev.style.width = cfg.preview.w+'px'; prev.style.height = cfg.preview.h+'px';
      prev.style.backgroundImage = 'url("'+BG[state.tab]+'")';
      prev.style.backgroundSize = '1920px 1080px';
      prev.style.backgroundPosition = '-'+p[0]+'px -'+p[1]+'px';
      layer.appendChild(prev);
    }

    var nextBtn = document.createElement('button');
    nextBtn.className = 'next-hot';
    nextBtn.style.left = cfg.next.x+'px'; nextBtn.style.top = cfg.next.y+'px';
    nextBtn.style.width = cfg.next.w+'px'; nextBtn.style.height = cfg.next.h+'px';
    nextBtn.title = 'Next';
    nextBtn.addEventListener('click', function(){
      console.log('Next clicked, tab=', state.tab, 'selected=', state.selected[state.tab]);
    });
    layer.appendChild(nextBtn);
  }

  $('#tab-choose-hot').addEventListener('click', function(){ state.tab='choose'; render(); });
  $('#tab-create-hot').addEventListener('click', function(){ state.tab='create'; render(); });

  function fit(){
    var c = Math.min(innerWidth/1920, innerHeight/1080);
    $('#stage').style.transform = 'scale('+c+')';
  }
  addEventListener('resize', fit);

  render();
  fit();
})();
</script>
</body>
</html>
